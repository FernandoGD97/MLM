seed: 42
model: {checkpoint: bert-base-multilingual-cased}
data: {path: data/corpus.parquet, id_column: doc_id, text_columns: [text]}
chunking: {max_length: 126, stride: 0}
objective: mlm
entities: {provider: gazetteer, path: data/terminology.txt}
masking:
  strategy: entity_first
  entity_budget_fraction: 0.5
  remainder: random
  replacement: bert_80_10_10
  mask_schedule: {type: linear, start: 0.30, end: 0.15}
training: {output_dir: outputs/entity-schedule, per_device_train_batch_size: 8, max_steps: 1000}
