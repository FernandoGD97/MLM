seed: 42
model: {checkpoint: bert-base-multilingual-cased}
data: {path: data/corpus.parquet, id_column: doc_id, text_columns: [text]}
chunking: {max_length: 126, stride: 0}
entities: {provider: gazetteer, path: data/terminology.txt}
phases:
  - {objective: clm, tokens: 1000000}
  - objective: mlm
    tokens: 1000000
    masking: {strategy: entity_first, probability: 0.15, entity_budget_fraction: 0.5, remainder: random, replacement: bert_80_10_10}
training: {output_dir: outputs/clm-to-entity-mlm, per_device_train_batch_size: 8}
