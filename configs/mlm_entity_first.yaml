seed: 42
model: {checkpoint: bert-base-multilingual-cased}
data: {path: data/corpus.parquet, id_column: doc_id, text_columns: [text]}
chunking: {max_length: 126, stride: 0}
objective: mlm
entities: {provider: gazetteer, path: data/terminology.txt}
masking: {strategy: entity_first, probability: 0.15, entity_budget_fraction: 0.5, remainder: content_random, replacement: bert_80_10_10}
training: {output_dir: outputs/entity-mlm, per_device_train_batch_size: 8, max_steps: 1000}
