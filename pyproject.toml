[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "encoder-continual-pretraining"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch", "transformers>=4.45", "pyarrow", "PyYAML"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
